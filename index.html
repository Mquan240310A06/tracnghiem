<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Trắc Nghiệm Thông Minh</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            background-color: var(--card);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1, h2 { text-align: center; color: var(--primary); }
        textarea {
            width: 100%; height: 200px; padding: 15px;
            border: 2px solid #e5e7eb; border-radius: 8px;
            font-size: 15px; margin-bottom: 20px;
            box-sizing: border-box; resize: vertical;
        }
        textarea:focus { outline: none; border-color: var(--primary); }
        button {
            background-color: var(--primary); color: white;
            border: none; padding: 12px 24px; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: background-color 0.2s; margin: 5px;
        }
        button:hover { background-color: var(--primary-hover); }
        button.btn-success { background-color: var(--success); }
        button.btn-success:hover { background-color: #059669; }
        button.btn-danger { background-color: var(--danger); }
        button.btn-danger:hover { background-color: #dc2626; }
        
        .question-card {
            background: #f9fafb; border: 1px solid #e5e7eb;
            border-radius: 8px; padding: 20px; margin-bottom: 20px;
        }
        .question-header {
            display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px;
        }
        .question-text { font-weight: bold; font-size: 1.1em; margin: 0; }
        .speaker-btn {
            background: #e5e7eb; color: #374151; padding: 6px 12px;
            font-size: 14px; border-radius: 20px; margin: 0 0 0 10px;
            flex-shrink: 0;
        }
        .speaker-btn:hover { background: #d1d5db; }
        
        .option-label {
            display: block; padding: 12px 15px; margin-bottom: 8px;
            background: white; border: 1px solid #d1d5db; border-radius: 6px;
            cursor: pointer; transition: all 0.2s;
        }
        .option-label:hover { background: #f3f4f6; border-color: var(--primary); }
        .option-label input { margin-right: 10px; }
        
        .result-msg {
            margin-top: 15px; padding: 12px; border-radius: 6px; font-weight: 500; display: none;
        }
        .result-msg.correct { display: block; background-color: #d1fae5; color: #065f46; }
        .result-msg.incorrect { display: block; background-color: #fee2e2; color: #991b1b; }
        .hidden { display: none !important; }
        .controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container" id="setupScreen">
    <h1>Hệ Thống Trắc Nghiệm</h1>
    <p style="text-align: center; color: #6b7280;">Dán đề trắc nghiệm của bạn vào bên dưới. <br><b>Quy tắc:</b> Đánh dấu <code>*</code> trước đáp án đúng (Ví dụ: <code>*A. Hà Nội</code>)</p>
    
    <textarea id="quizInput" placeholder="Câu 1: Thủ đô của Việt Nam là gì?
A. TP.HCM
*B. Hà Nội
C. Đà Nẵng
D. Huế

Câu 2: Mặt trời mọc ở hướng nào?
*A. Hướng Đông
B. Hướng Tây
C. Hướng Nam
D. Hướng Bắc"></textarea>
    
    <div class="controls">
        <button onclick="parseQuiz()">Tạo Đề & Bắt Đầu Làm</button>
    </div>
</div>

<div class="container hidden" id="quizScreen">
    <div class="controls">
        <button class="speaker-btn" onclick="shuffleQuiz()">🔀 Xáo trộn đề</button>
        <button class="speaker-btn" onclick="location.reload()">📝 Nhập đề mới</button>
    </div>
    
    <div id="quizContainer"></div>
    
    <div class="controls" style="margin-top: 30px;">
        <button class="btn-success" onclick="submitQuiz()" id="submitBtn">Nộp Bài</button>
        <button class="btn-danger hidden" onclick="retryIncorrect()" id="retryBtn">Làm Lại Các Câu Sai</button>
    </div>
</div>

<script>
    let questionsData = [];
    let wrongIndices = [];

    // Tính năng đọc giọng nói (Dùng AI gốc của trình duyệt)
    function speak(text) {
        window.speechSynthesis.cancel();
        let utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'vi-VN';
        window.speechSynthesis.speak(utterance);
    }

    // Tách câu hỏi
    function parseQuiz() {
        const text = document.getElementById('quizInput').value.trim();
        if (!text) return alert("Vui lòng nhập nội dung đề!");
        
        const blocks = text.split(/(?=Câu \d+:|Bài \d+:|^\d+\.)/im).filter(b => b.trim());
        questionsData = blocks.map(block => {
            const lines = block.split('\n').filter(l => l.trim());
            const question = lines[0];
            const options = [];
            let answer = -1;
            
            for (let i = 1; i < lines.length; i++) {
                let opt = lines[i].trim();
                if (opt.startsWith('*')) {
                    answer = i - 1;
                    opt = opt.substring(1).trim();
                }
                options.push(opt);
            }
            return { question, options, answer };
        }).filter(q => q.options.length > 0 && q.answer !== -1);
        
        if (questionsData.length === 0) {
            alert("Không tìm thấy câu hỏi hợp lệ! Hãy chắc chắn bạn đã đánh dấu * trước đáp án đúng.");
            return;
        }
        
        document.getElementById('setupScreen').classList.add('hidden');
        document.getElementById('quizScreen').classList.remove('hidden');
        renderQuiz(questionsData);
    }

    // Thuật toán xáo trộn mảng
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // Xáo trộn đề
    function shuffleQuiz() {
        questionsData = shuffleArray(questionsData);
        questionsData.forEach(q => {
            let optsWithStatus = q.options.map((opt, i) => ({ text: opt, isCorrect: i === q.answer }));
            optsWithStatus = shuffleArray(optsWithStatus);
            q.options = optsWithStatus.map(o => o.text);
            q.answer = optsWithStatus.findIndex(o => o.isCorrect);
        });
        renderQuiz(questionsData);
    }

    // Hiển thị đề
    function renderQuiz(questions, indicesToRender = null) {
        const container = document.getElementById('quizContainer');
        container.innerHTML = '';
        document.getElementById('retryBtn').classList.add('hidden');
        document.getElementById('submitBtn').classList.remove('hidden');

        const list = indicesToRender ? indicesToRender.map(i => ({q: questions[i], index: i})) : questions.map((q, i) => ({q, index: i}));
        
        list.forEach((item, displayOrder) => {
            const q = item.q;
            const idx = item.index;
            const html = `
                <div class="question-card" id="card_${idx}">
                    <div class="question-header">
                        <p class="question-text">Câu ${displayOrder + 1}: ${q.question}</p>
                        <button class="speaker-btn" onclick="speak('${q.question}')">🔊 Đọc</button>
                    </div>
                    <div class="options-container">
                        ${q.options.map((opt, optIdx) => `
                            <label class="option-label">
                                <input type="radio" name="q_${idx}" value="${optIdx}"> ${opt}
                            </label>
                        `).join('')}
                    </div>
                    <div id="result_${idx}" class="result-msg"></div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        });
    }

    // Chấm điểm
    function submitQuiz() {
        wrongIndices = [];
        let score = 0;
        let totalRendered = 0;

        questionsData.forEach((q, i) => {
            const resultDiv = document.getElementById(`result_${i}`);
            if (!resultDiv) return; // Bỏ qua nếu câu không hiển thị (lúc làm lại)
            totalRendered++;
            
            const selected = document.querySelector(`input[name="q_${i}"]:checked`);
            if (selected && parseInt(selected.value) === q.answer) {
                resultDiv.innerHTML = '✅ Chính xác!';
                resultDiv.className = 'result-msg correct';
                score++;
            } else {
                resultDiv.innerHTML = `❌ Sai rồi! Đáp án đúng là: <b>${q.options[q.answer]}</b>`;
                resultDiv.className = 'result-msg incorrect';
                wrongIndices.push(i);
            }
        });

        document.getElementById('submitBtn').classList.add('hidden');
        
        if (wrongIndices.length > 0) {
            document.getElementById('retryBtn').classList.remove('hidden');
            document.getElementById('retryBtn').innerText = `Làm Lại ${wrongIndices.length} Câu Sai`;
            window.scrollTo({ top: document.getElementById('quizContainer').scrollHeight, behavior: 'smooth' });
        } else {
            alert(`🎉 Chúc mừng! Bạn đã đúng ${score}/${totalRendered} câu.`);
        }
    }

    // Làm lại câu sai
    function retryIncorrect() {
        if (wrongIndices.length > 0) {
            // Xáo trộn nhẹ các đáp án của câu sai trước khi làm lại
            wrongIndices.forEach(idx => {
                let q = questionsData[idx];
                let opts = q.options.map((opt, i) => ({ text: opt, isCorrect: i === q.answer }));
                opts = shuffleArray(opts);
                q.options = opts.map(o => o.text);
                q.answer = opts.findIndex(o => o.isCorrect);
            });
            renderQuiz(questionsData, wrongIndices);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }
</script>
</body>
</html>
